name: live-stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: farheenimam/farheenimam.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Fetch GitHub stats
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/fetch_stats.py assets/stats.json

      - name: Copy data to pages site
        run: |
          mkdir -p site/data
          cp assets/stats.json site/data/stats.json

      - name: Render images
        run: |
          (cd site && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python scripts/render_stats.py http://localhost:8000 assets

      - name: Commit profile images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update live stats" || echo "no changes"
          git push

      - name: Push pages data
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data live-stats.js
          git commit -m "Update live stats data" || echo "no changes"
          git push
