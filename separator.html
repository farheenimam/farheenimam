<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Separator</title>
<style>
  html, body { margin: 0; background: #050509; }
  .sep {
    width: 1000px; height: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .sep::before {
    content: '';
    width: 100%; height: 2px;
    background: #FF2DAA;
    box-shadow: 0 0 8px rgba(255, 45, 170, 0.8), 0 0 18px rgba(255, 45, 170, 0.35);
  }
</style>
</head>
<body>
<div class="sep" id="sep"></div>
</body>
</html>
